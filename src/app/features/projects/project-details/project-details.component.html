<div class="project-details" *ngIf="project">
  <!-- Back button -->
  <button class="back-button" (click)="backToProjects()">
    ← Back to projects
  </button>

  <!-- Project header -->
  <h1 class="project-title">{{ project.title }}</h1>
  <!-- Project subtitle -->
  <h2 class="project-subtitle">{{ project.subtitle }}</h2>

  <!-- Intro section -->
  <div class="card">
    <p class="intro">
      {{ project.details.intro }}
    </p>
  </div>

  <!-- Sections -->
  <div
    class="card section-card"
    *ngFor="let section of project.details.sections"
  >
    <div class="section-content">
      <!-- Text -->
      <div class="text">
        <h2>{{ section.heading }}</h2>
        <p [innerHTML]="section.content"></p>
        <!-- IFRAME only for project 2 -->
        <div
          *ngIf="
            project.id === 2 &&
            section.heading === 'Project Repository and Playable Version'
          "
          class="itch-embed"
        >
          <iframe
            frameborder="0"
            src="https://itch.io/embed/4303744?linkback=true"
            width="552"
            height="167"
          >
            <a href="https://kiwiwir.itch.io/marbles-adventure">
              Marble's Adventure by kiwiwir
            </a>
          </iframe>
        </div>
      </div>

      <!-- Image (only if exists) -->
      <div class="images" *ngIf="section.images?.length">
        <div
          class="img-wrapper"
          *ngFor="let img of section.images; let i = index"
        >
          <img
            [src]="img"
            [alt]="section.heading"
            (click)="openImage(img)"
            class="clickable"
          />

          <div class="caption">Figure {{ getFigureNumber() }}</div>
        </div>
      </div>

      <!-- Caption -->
      <div class="text">
        <p>{{ section.caption }}</p>
      </div>
    </div>
  </div>

  <!-- Outro (optional) -->
  <div class="card" *ngIf="project.details.outro">
    <p class="outro">
      {{ project.details.outro }}
    </p>
  </div>
</div>

<!-- IMAGE MODAL -->
<div class="image-modal" *ngIf="selectedImage" (click)="closeImage()">
  <img
    [src]="selectedImage"
    class="modal-image"
    (click)="$event.stopPropagation()"
  />
</div>
